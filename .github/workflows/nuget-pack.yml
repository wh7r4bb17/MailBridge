name: Pack NuGet

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-pack:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore MailBridge.Core\MailBridge.Core.csproj

      - name: Build Project
        run: dotnet build MailBridge.Core\MailBridge.Core.csproj --configuration Release --no-restore

      - name: Create NuGet Package
        run: dotnet pack MailBridge.Core\MailBridge.Core.csproj --configuration Release --no-build --output nupkgs

      - name: Upload NuGet Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkgs/

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $packagePath = Get-ChildItem -Path nupkgs -Filter "MailBridge.Core*.nupkg" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($packagePath) {
              dotnet nuget push $packagePath.FullName --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          } else {
              Write-Error "No package found matching MailBridge.Core*.nupkg"
          }
